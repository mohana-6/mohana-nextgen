  tech360:
    type: vector
    inputs:
      - route_log.prod_tech360
    address: localhost:6008
  #  acknowledgements:
   #   enabled: true

  mdsc:
    type: vector
    inputs:
      - route_log.prod_mdsc
    address: localhost:6009
 #   acknowledgements:
 #     enabled: true

  f360:
    type: vector
    inputs:
      - route_log.prod_f360
    address: localhost:6011

  stld:
    type: vector
    inputs:
      - route_log.prod_stld
    address: localhost:6012

  fnp:
    type: vector
    inputs:
      - route_log.prod_fnp
    address: localhost:6013

  people-analytics:
    type: vector
    inputs:
      - route_log.prod_people-analytics
